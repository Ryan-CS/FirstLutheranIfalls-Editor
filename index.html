<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>First Lutheran Editor - Migration Test</title>
    <link rel="stylesheet" href="./admin/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand__title">First Lutheran Editor</span>
        <span class="brand__subtitle">Migration test: GitHub Pages frontend → Cloudflare Worker → GitHub test branch</span>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="open-live">Open Test Site</button>
        <button type="button" class="btn btn--primary" id="save" disabled>Save Draft</button>
        <button type="button" class="btn" id="publish" disabled>Publish Test Branch</button>
        <button type="button" class="btn" id="discard" disabled>Discard Draft</button>
      </div>
    </header>

    <section class="authbar" aria-label="Editor authentication">
      <div>
        <strong>Test editor authentication</strong>
        <span class="auth-help">Enter the Worker editor token. It stays in this browser tab's memory and is never stored in GitHub.</span>
      </div>
      <div class="auth-controls">
        <label for="session-token">Editor token</label>
        <input id="session-token" type="password" autocomplete="current-password" spellcheck="false" />
        <button type="button" class="btn btn--primary" id="connect">Connect</button>
        <span id="connection-state" class="connection-state">Not connected</span>
      </div>
    </section>

    <main class="layout">
      <aside class="sidebar">
        <div class="sidebar__header">Pages</div>
        <div class="sidebar__list" id="page-list"></div>
      </aside>

      <section class="editor">
        <div class="toolbar" id="toolbar">
          <button type="button" class="btn" data-cmd="bold">Bold</button>
          <button type="button" class="btn" data-cmd="italic">Italic</button>
          <button type="button" class="btn" data-cmd="underline">Underline</button>
          <button type="button" class="btn" data-cmd="insertUnorderedList">Bullets</button>
          <button type="button" class="btn" data-cmd="insertOrderedList">Numbered</button>
          <button type="button" class="btn" data-cmd="formatBlock" data-value="h2">Heading</button>
          <button type="button" class="btn" data-cmd="formatBlock" data-value="h3">Subhead</button>
          <button type="button" class="btn" data-cmd="formatBlock" data-value="p">Paragraph</button>
          <button type="button" class="btn" id="add-link">Link</button>
          <button type="button" class="btn" id="upload-image">Upload Image</button>
          <div class="template-picker">
            <select id="template-select" class="template-select">
              <option value="">Insert template...</option>
              <option value="callout">Callout box</option>
              <option value="two-column">Two columns</option>
              <option value="event-card">Event card</option>
            </select>
            <button type="button" class="btn" id="insert-template">Insert</button>
          </div>
        </div>
        <div class="status" id="status">Connect to the test Worker to begin.</div>
        <iframe class="canvas" id="canvas" title="Editor canvas" sandbox="allow-same-origin"></iframe>
      </section>
    </main>
    <input type="file" id="image-input" accept="image/*" hidden />

    <script src="./admin/config.js"></script>
    <script src="./admin/app.js" type="module"></script>
  </body>
</html>
