<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">First Lutheran durable publishing architecture: two paths, one source of truth</title>
  <desc id="desc">The privileged staff path runs from a staff browser through the admin domain and static editor to a constrained trusted publishing service, which alone holds the repository write credential and writes unpublished state in versioned canonical storage. Safe explicit publication advances unpublished state to published state. Separately, the unprivileged public path runs from a visitor browser through the public domain to a static public host that receives only published files. Visitors never pass through the trusted publishing service. Current 2026 provider names are secondary labels.</desc>
  <defs>
    <style>
      .bg{fill:#f7f4ec}.lane{fill:#fffdf8;stroke:#d6cfc2;stroke-width:2}.core{fill:#edf4ef;stroke:#476b57;stroke-width:3}.guard{fill:#f5edf3;stroke:#7b556f;stroke-width:3}.impl{fill:#fff7e8;stroke:#b7864e;stroke-width:2}.neutral{fill:#fffdf8;stroke:#8d998f;stroke-width:2}.title{font:700 34px Georgia,serif;fill:#203027}.subtitle{font:400 18px Arial,sans-serif;fill:#5b675f}.laneTitle{font:700 16px Arial,sans-serif;letter-spacing:2px;fill:#66736b}.label{font:700 21px Arial,sans-serif;fill:#26372d}.small{font:400 16px Arial,sans-serif;fill:#59655e}.tiny{font:700 14px Arial,sans-serif;fill:#95662f}.guardText{font:700 14px Arial,sans-serif;fill:#7b556f}.note{font:700 15px Arial,sans-serif;fill:#46544b}.arrow{stroke:#66736b;stroke-width:4;fill:none}.arrowGuard{stroke:#7b556f;stroke-width:4;fill:none}.arrowRead{stroke:#476b57;stroke-width:4;fill:none}.dash{stroke-dasharray:9 8}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#66736b"/></marker>
    <marker id="arrowGuard" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7b556f"/></marker>
    <marker id="arrowRead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#476b57"/></marker>
  </defs>

  <rect class="bg" width="1600" height="1120"/>
  <text class="title" x="800" y="50" text-anchor="middle">First Lutheran Durable Publishing Architecture</text>
  <text class="subtitle" x="800" y="82" text-anchor="middle">Two independent access paths share one versioned source of truth. Preserve the roles and safety boundaries; providers may change.</text>

  <circle cx="420" cy="116" r="8" fill="#476b57"/><text class="small" x="437" y="122">durable role</text>
  <circle cx="580" cy="116" r="8" fill="#7b556f"/><text class="small" x="597" y="122">privileged / safety boundary</text>
  <circle cx="835" cy="116" r="8" fill="#b7864e"/><text class="small" x="852" y="122">current 2026 implementation</text>

  <rect class="lane" x="55" y="150" rx="28" width="690" height="620"/>
  <rect class="lane" x="855" y="150" rx="28" width="690" height="620"/>
  <text class="laneTitle" x="400" y="185" text-anchor="middle">STAFF / PRIVILEGED PATH</text>
  <text class="laneTitle" x="1200" y="185" text-anchor="middle">PUBLIC / UNPRIVILEGED PATH</text>

  <!-- Staff path -->
  <rect class="neutral" x="155" y="215" rx="20" width="490" height="68"/>
  <text class="label" x="400" y="246" text-anchor="middle">Staff browser</text>
  <text class="small" x="400" y="268" text-anchor="middle">Untrusted client: anything sent here can be inspected or changed</text>

  <path class="arrow" d="M400 283 L400 318" marker-end="url(#arrow)"/>
  <rect class="core" x="155" y="328" rx="20" width="490" height="76"/>
  <text class="label" x="400" y="357" text-anchor="middle">Admin domain-name routing</text>
  <text class="tiny" x="400" y="383" text-anchor="middle">Today: admin.firstlutheranifalls.site</text>

  <path class="arrow" d="M400 404 L400 438" marker-end="url(#arrow)"/>
  <rect class="core" x="155" y="448" rx="22" width="490" height="92"/>
  <text class="label" x="400" y="480" text-anchor="middle">Static editor interface</text>
  <text class="small" x="400" y="505" text-anchor="middle">Human-friendly editing, preview and navigation</text>
  <text class="tiny" x="400" y="526" text-anchor="middle">Today: GitHub Pages · Editor repository</text>

  <path class="arrowGuard" d="M400 540 L400 581" marker-end="url(#arrowGuard)"/>
  <text class="guardText" x="420" y="570">authenticated encrypted request</text>

  <rect class="guard" x="115" y="591" rx="24" width="570" height="142"/>
  <text class="label" x="400" y="625" text-anchor="middle">Constrained trusted publishing service</text>
  <text class="small" x="400" y="653" text-anchor="middle">Enforces repository, branch, path, file-type and operation limits</text>
  <text class="guardText" x="400" y="681" text-anchor="middle">Privileged repository write credential exists HERE ONLY</text>
  <text class="tiny" x="400" y="710" text-anchor="middle">Today: Cloudflare Worker · firstlutheranifalls-editor</text>

  <!-- Public path -->
  <rect class="neutral" x="955" y="215" rx="20" width="490" height="68"/>
  <text class="label" x="1200" y="246" text-anchor="middle">Visitor browser</text>
  <text class="small" x="1200" y="268" text-anchor="middle">Reads public content; receives no publishing credential</text>

  <path class="arrow" d="M1200 283 L1200 318" marker-end="url(#arrow)"/>
  <rect class="core" x="955" y="328" rx="20" width="490" height="76"/>
  <text class="label" x="1200" y="357" text-anchor="middle">Public domain-name routing</text>
  <text class="tiny" x="1200" y="383" text-anchor="middle">Today: firstlutheranifalls.site</text>

  <path class="arrow" d="M1200 404 L1200 438" marker-end="url(#arrow)"/>
  <rect class="core" x="955" y="448" rx="22" width="490" height="104"/>
  <text class="label" x="1200" y="480" text-anchor="middle">Static public file host</text>
  <text class="small" x="1200" y="505" text-anchor="middle">Serves already-published website files</text>
  <text class="small" x="1200" y="528" text-anchor="middle">No content database or publishing credential is required here</text>
  <text class="tiny" x="1200" y="548" text-anchor="middle">Today: GitHub Pages · Website repository</text>

  <rect class="impl" x="955" y="594" rx="20" width="490" height="116"/>
  <text class="label" style="font-size:18px" x="1200" y="626" text-anchor="middle">Optional public-data helper</text>
  <text class="small" x="1200" y="652" text-anchor="middle">May supply non-secret dynamic data; not part of publishing trust</text>
  <text class="tiny" x="1200" y="679" text-anchor="middle">Today: separate Website Worker for public YouTube RSS</text>
  <text class="small" style="font-size:14px" x="1200" y="699" text-anchor="middle">It has no repository publishing credential.</text>
  <path class="arrowRead dash" d="M1200 552 L1200 594" marker-end="url(#arrowRead)"/>

  <!-- Shared canonical state -->
  <rect class="core" x="250" y="805" rx="30" width="1100" height="250"/>
  <text class="label" style="font-size:24px" x="800" y="844" text-anchor="middle">Versioned canonical Website storage — one source of truth</text>
  <text class="small" x="800" y="872" text-anchor="middle">Ordinary website files plus recoverable change history</text>
  <text class="tiny" x="800" y="897" text-anchor="middle">Today: Ryan-CS/FirstLutheranIfalls-Website on GitHub</text>

  <rect class="neutral" x="350" y="925" rx="18" width="350" height="82"/>
  <text class="label" style="font-size:19px" x="525" y="955" text-anchor="middle">Unpublished state</text>
  <text class="small" style="font-size:14px" x="525" y="980" text-anchor="middle">Saved staff work; not visible on the public site</text>
  <text class="tiny" x="525" y="1001" text-anchor="middle">Today: editor-test-draft branch</text>

  <rect class="neutral" x="900" y="925" rx="18" width="350" height="82"/>
  <text class="label" style="font-size:19px" x="1075" y="955" text-anchor="middle">Published state</text>
  <text class="small" style="font-size:14px" x="1075" y="980" text-anchor="middle">Only this state may feed public static delivery</text>
  <text class="tiny" x="1075" y="1001" text-anchor="middle">Today: migration/github-pages-worker-test branch</text>

  <path class="arrowGuard" d="M700 966 L900 966" marker-end="url(#arrowGuard)"/>
  <text class="guardText" x="800" y="945" text-anchor="middle">EXPLICIT SAFE PUBLISH · NO FORCED OVERWRITE</text>

  <!-- Staff writes into draft -->
  <path class="arrowGuard" d="M400 733 C400 770 450 790 525 925" marker-end="url(#arrowGuard)"/>
  <text class="guardText" x="330" y="784">validated save/read/upload operations</text>

  <!-- Published state feeds public host, separate from visitor request path -->
  <path class="arrowRead" d="M1075 925 C1075 835 1400 825 1400 740 L1400 570 C1400 560 1375 552 1348 552" marker-end="url(#arrowRead)"/>
  <text class="note" x="1215" y="792">published files / deployment source</text>

  <!-- Core invariant callout -->
  <rect class="impl" x="250" y="1070" rx="18" width="1100" height="36"/>
  <text class="note" x="800" y="1094" text-anchor="middle">Core invariant: visitors never pass through the privileged publishing service. Staff changes reach visitors only after entering versioned unpublished state and an explicit safe publish.</text>
</svg>